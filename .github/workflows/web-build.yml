name: Web Build

on:
  push:
    branches:
      - gpt
  pull_request:
    branches:
      - gpt

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck and build
        run: npm run build
