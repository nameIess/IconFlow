name: IconFlow CI
run-name: "CI • ${{ github.event_name == 'pull_request' && format('PR #{0}: {1}', github.event.number, github.event.pull_request.title) || format('{0} @ {1}', github.ref_name, github.sha) }}"

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iconflow-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-readiness:
    name: IconFlow production readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout IconFlow
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Enforce dependency audit result
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::Dependency audit failed. Review the audit output for vulnerabilities or registry errors."
          exit 1
