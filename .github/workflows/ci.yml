name: Build IconFlow

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install
        run: npm install --ignore-scripts --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=high --no-package-lock

      - name: Typecheck and build
        run: npm run build
