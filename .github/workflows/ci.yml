name: Build IconFlow

on:
  push:
    branches: [gpt]
  pull_request:
    branches: [gpt]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build
