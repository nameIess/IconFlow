name: Build IconFlow

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install
        run: npm install --ignore-scripts --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=high --no-package-lock

      - name: Test Vite share preview resolver
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/iconflow-vite.log 2>&1 &
          pid=$!
          sleep 3
          curl -fsS "http://127.0.0.1:5173/api/resolve-icon?url=https%3A%2F%2Fmacosicons.com%2F%3Ficon%3DIc1LCu7E7f" | tee /tmp/iconflow-resolver.json
          grep -q '"assetType":"icns"' /tmp/iconflow-resolver.json
          grep -q '"previewUrl":"https://s3-new.macosicons.com/macosicons/parse/low_res_' /tmp/iconflow-resolver.json
          kill "$pid"

      - name: Typecheck and build
        run: npm run build
