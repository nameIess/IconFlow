name: IconFlow CI

run-name: >-
  IconFlow CI · ${{ github.event_name == 'pull_request'
  && format('PR #{0}', github.event.pull_request.number)
  || github.ref_name }}

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  push:
    branches:
      - master
      - 'feature/**'
      - 'fix/**'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iconflow-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and production build
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Enforce dependency audit result
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::Dependency audit failed. Review the audit output for vulnerabilities or registry errors."
          exit 1
