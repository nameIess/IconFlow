name: IconFlow CI

run-name: >-
  IconFlow CI · ${{ github.event_name == 'pull_request'
  && format('PR #{0}', github.event.number)
  || github.ref_name }}

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  # Run CI on the default branch as well as active implementation branches.
  push:
    branches:
      - master
      - "feature/**"
      - "fix/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iconflow-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, typecheck, audit, and build
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate Docker release version rules
        run: node scripts/test-docker-release-version.mjs

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit and integration tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build production app
        run: npm run build
