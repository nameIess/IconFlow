name: "💬 Question / support"
description: Ask for help using IconFlow or its API
title: "[Question]: "
labels: ["question", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you're trying to accomplish and where you're stuck. Include only the details needed to understand the issue.

        **This is a public forum. Never include API keys, access tokens, private user data, or confidential logs.**
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Website or editor
        - Finding icons
        - Generating or editing icons
        - Exporting or converting assets
        - API integration
        - Authentication or usage limits
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: Describe your goal, the relevant feature or endpoint, and the problem you're facing.
      placeholder: "I'm trying to… but…"
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Share relevant steps, a minimal code sample, or a redacted request/response if useful.
      placeholder: "I tried… and got…"
  - type: input
    id: docs
    attributes:
      label: Relevant documentation or public link
      description: Optional link to the documentation or example you're following.
      placeholder: "https://…"
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I removed credentials and private or personal information.
          required: true
