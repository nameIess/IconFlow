name: "🧩 Icon editing, conversion, or export"
description: Report issues with masking, editing, generation, or downloaded icon assets
title: "[Export/Editor]: "
labels:
  - bug
body:
  - type: dropdown
    id: workflow
    attributes:
      label: Affected workflow
      options:
        - App icon masking / squircle
        - Icon editing or background removal
        - AI icon generation
        - macOS .icns conversion
        - Windows .ico conversion
        - Linux icon package
        - Xcode .appiconset or .icon bundle
        - Web favicon pack
        - Multi-platform release pack
        - Preview rendering
        - Other
    validations:
      required: true
  - type: dropdown
    id: symptom
    attributes:
      label: What went wrong?
      options:
        - Output file will not download or open
        - Incorrect dimensions or file format
        - Artwork is cropped, shifted, or scaled incorrectly
        - Background, alpha, or shadow is incorrect
        - Generated or exported output is missing
        - Preview does not match the output
        - Error or timeout
        - Other
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source image / input details
      description: Describe the file type, dimensions, transparency, or other relevant details. Only attach images you can share publicly.
      placeholder: "e.g. 1024×1024 PNG with transparent background"
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Selected options
      description: Include output format, platform, masking/size/offset/background options, and other relevant settings.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Choose the source…
        2. Select the workflow and options…
        3. Generate/export…
        4. Observe the output…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected output
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual output or error
      description: Include safe error text and status codes; do not include API keys or private data.
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / operating system
      placeholder: "e.g. Safari 18 on macOS 15"
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: I removed credentials and private data from attachments and logs.
          required: true
