name: User Support 🆘
description: Get help and troubleshooting — fast, friendly support for your questions and issues.
assignees: [nameIess]
labels: ["help wanted", "question", "community"]
body:
  - type: markdown
    attributes:
      value: |
        ### Need some help? ❓
        Before opening a support request, please check the documentation and existing discussions.

  - type: checkboxes
    id: docs_check
    attributes:
      label: 📘 Pre-check Checklist
      description: "Help us help you by confirming what you have already investigated."
      options:
        - label: "I have read the README/Documentation"
        - label: "I have searched through existing GitHub Issues and Discussions"
    validations:
      required: true

  - type: textarea
    id: support_need
    attributes:
      label: 🧩 What do you need help with?
      description: "Provide a clear and concise description of what you are trying to achieve."
      placeholder: "e.g., I am trying to configure the authentication layer but I am unsure if..."
    validations:
      required: true

  - type: textarea
    id: tried_already
    attributes:
      label: 🛠️ What have you tried?
      description: "List the specific steps or configurations you have already attempted."
      placeholder: |
        - Followed the getting started guide
        - Checked environment variables
        - Tested on a different machine
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 💻 Environment Details
      description: "Information about your local setup to help us reproduce the context."
      placeholder: |
        - OS: Windows / Linux / macOS
        - Version/Commit: v1.0.2
        - Dependency Versions: Node 20
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 🧾 Additional Context
      description: "Include screenshots, log files, related links, or any other relevant information."
    validations:
      required: false
