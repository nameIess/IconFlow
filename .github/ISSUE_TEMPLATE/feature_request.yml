name: "✨ Feature request"
description: Propose an improvement or capability for IconFlow
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Help us understand the user need behind your idea. Search existing issues first; requests with a clear problem and use case are easier to evaluate.

        Please don't include private user data, credentials, or confidential information.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the friction or limitation you encounter and who it affects.
      placeholder: "When I need to…, the current workflow…"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Explain the behavior or workflow you would like to see. A specific implementation is optional.
      placeholder: "It would help if IconFlow could…"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - Icon search and discovery
        - Icon editing and customization
        - AI generation
        - Conversion and export
        - Background removal
        - API and developer experience
        - Performance and reliability
        - Accessibility and interface
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: Example use case
      description: How would this help you? Describe a practical workflow or outcome.
      placeholder: "I would use this to…"
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Mention existing tools, workarounds, or approaches you've tried.
      placeholder: "So far, I've tried…"
  - type: textarea
    id: extra
    attributes:
      label: Examples or additional context
      description: Add relevant links, mockups, or sample inputs. Only share material you are allowed to make public.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues for a similar request.
          required: true
