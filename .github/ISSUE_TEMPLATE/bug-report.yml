name: Bug Report 🐛
description: Report bugs and issues — help us improve by sharing detailed problem reports.
assignees: [nameIess]
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### Thank you for reporting a bug!
        Please provide as much detail as possible so we can resolve the issue quickly.

  - type: dropdown
    id: severity
    attributes:
      label: 🎯 Impact & Severity
      description: "How significantly does this bug affect your use of the project?"
      options:
        - "Blocks usage completely ❌"
        - "Partial functionality affected ⚠️"
        - "Minor UI/UX issue or typo 🟡"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 🧩 Problem Description
      description: "Clearly describe the bug. What were you doing when it occurred?"
      placeholder: "e.g., The app crashes when I try to save a file with special characters in the name."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔁 Steps to Reproduce
      description: "List the exact steps needed to reproduce the error."
      placeholder: |
        1. Open the app
        2. Navigate to '...'
        3. Click '...'
        4. Observe the crash
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: 📤 Actual vs Expected Behavior
      description: "Contrast the result you wanted with the result you actually received."
      placeholder: |
        Expected: The file saves successfully.
        Actual: An error modal appears and the file is not saved.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 🧪 Logs / Error Output
      description: "Paste any relevant logs, stack traces, or error messages."
      render: shell
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: 💻 Environment Details
      description: "Information about your local setup."
      placeholder: |
        - OS: Windows 11 / macOS Sonoma / Ubuntu 22.04
        - Version/Commit: v1.0.2
        - Runtime: Node 20
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 🧾 Additional Context
      description: "Screenshots, related issues, or any other helpful information."
    validations:
      required: false
