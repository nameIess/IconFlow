name: "🐛 Bug report"
description: Report a reproducible problem with IconFlow
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve **IconFlow**. Before opening an issue, search for an existing report.

        **Protect your privacy:** never post API keys, access tokens, private URLs, personal data, or unredacted logs. Public issues are visible to everyone.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
      placeholder: "When I…, I expected…, but…"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of IconFlow is affected?
      options:
        - Icon search
        - Icon editor or masking
        - AI icon generation
        - Image conversion or export
        - Background removal
        - Favicon or release pack
        - API or authentication
        - Usage limits
        - Website or interface
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest set of steps that reliably reproduces the problem.
      placeholder: |
        1. Open…
        2. Choose…
        3. Select…
        4. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
      description: What should happen, and what happens instead?
      placeholder: "Expected… / Actual…"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or error details
      description: Include relevant errors, HTTP status codes, or redacted request/response examples. Remove secrets and personal data.
      render: text
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and version, operating system, app version/commit, or runtime as applicable.
      placeholder: "e.g. Firefox 132 on Ubuntu 24.04"
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: I removed secrets and private or personal information.
          required: true
